name: Daily Advanced Analytics Portfolio Update

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portfolio:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate analytics project assets
        shell: bash
        run: |
          set -e
          DATE=$(date +"%Y-%m-%d")
          STAMP=$(date +"%Y%m%d")
          DAY=$(date +"%j")

          mkdir -p case-studies sql python docs dashboards charts issues

          PROJECTS=(
            "store_performance|Store Performance Analytics|Rank stores by sales, visits, average ticket, and operational performance."
            "customer_retention|Customer Retention Analytics|Analyze repeat customer behavior and retention risk by cohort."
            "sales_forecasting|Sales Forecasting|Estimate monthly sales trend using historical store-level performance."
            "ratings_analysis|Google Ratings Analysis|Connect review volume and ratings movement to customer experience performance."
            "promotion_effectiveness|Promotion Effectiveness|Evaluate lift from campaigns using pre/post performance trends."
            "service_conversion|Service Conversion Funnel|Measure conversion from visit to completed service transaction."
            "regional_benchmarking|Regional Benchmarking|Compare region-level KPIs and identify outlier markets."
          )

          IDX=$((10#$DAY % ${#PROJECTS[@]}))
          IFS='|' read -r SLUG TITLE DESCRIPTION <<< "${PROJECTS[$IDX]}"

          CASE_DIR="case-studies/$SLUG"
          SQL_FILE="sql/${STAMP}_${SLUG}.sql"
          PY_FILE="python/${STAMP}_${SLUG}_analysis.py"
          DASH_FILE="dashboards/${STAMP}_${SLUG}_dashboard_spec.md"
          CASE_FILE="$CASE_DIR/${STAMP}_case_study.md"
          mkdir -p "$CASE_DIR"

          cat > "$CASE_FILE" <<CASEEOF
# $TITLE - $DATE

## Business Context
$DESCRIPTION

## Business Question
Which locations or customer segments need attention, and what KPI movement explains the opportunity?

## Data Assumptions
- Store-level daily sales, visits, tickets, and rating data are available.
- Closed locations are excluded from current-period performance comparisons.
- Prior-period baseline is used for trend and growth calculations.

## Analytical Approach
1. Build period-level KPI aggregations.
2. Compare current period with prior period.
3. Rank locations by performance gap and opportunity size.
4. Translate findings into stakeholder-ready recommendations.

## Expected Output
- Ranked store or segment table
- KPI movement explanation
- Dashboard-ready metric definitions
- Recommended follow-up actions

## Recommendation Template
Focus first on high-volume locations with declining conversion, ratings, or average ticket because improvements there can have larger business impact.
CASEEOF

          cat > "$SQL_FILE" <<SQLEOF
-- $TITLE
-- Created: $DATE
-- Purpose: Portfolio SQL case study for retail analytics decision support

WITH base_metrics AS (
    SELECT
        s.region,
        s.store_id,
        s.store_name,
        DATE_TRUNC('month', f.business_date) AS metric_month,
        SUM(f.sales_amount) AS total_sales,
        SUM(f.visit_count) AS total_visits,
        SUM(f.transaction_count) AS total_transactions,
        AVG(f.google_rating) AS avg_google_rating,
        SUM(f.review_count) AS total_reviews
    FROM fact_store_daily f
    JOIN dim_store s
        ON f.store_id = s.store_id
    WHERE s.store_status = 'Open'
    GROUP BY
        s.region,
        s.store_id,
        s.store_name,
        DATE_TRUNC('month', f.business_date)
),
period_comparison AS (
    SELECT
        region,
        store_id,
        store_name,
        metric_month,
        total_sales,
        total_visits,
        total_transactions,
        avg_google_rating,
        total_reviews,
        LAG(total_sales) OVER (PARTITION BY store_id ORDER BY metric_month) AS prior_sales,
        LAG(total_visits) OVER (PARTITION BY store_id ORDER BY metric_month) AS prior_visits,
        LAG(avg_google_rating) OVER (PARTITION BY store_id ORDER BY metric_month) AS prior_rating
    FROM base_metrics
),
scored AS (
    SELECT
        region,
        store_id,
        store_name,
        metric_month,
        total_sales,
        total_visits,
        total_transactions,
        ROUND(total_sales / NULLIF(total_transactions, 0), 2) AS average_ticket,
        ROUND(100.0 * total_transactions / NULLIF(total_visits, 0), 2) AS conversion_rate_pct,
        ROUND(100.0 * (total_sales - prior_sales) / NULLIF(prior_sales, 0), 2) AS sales_growth_pct,
        ROUND(100.0 * (total_visits - prior_visits) / NULLIF(prior_visits, 0), 2) AS visit_growth_pct,
        ROUND(avg_google_rating - prior_rating, 2) AS rating_change
    FROM period_comparison
    WHERE prior_sales IS NOT NULL
)
SELECT
    region,
    store_id,
    store_name,
    metric_month,
    total_sales,
    total_visits,
    average_ticket,
    conversion_rate_pct,
    sales_growth_pct,
    visit_growth_pct,
    rating_change
FROM scored
ORDER BY sales_growth_pct ASC, total_sales DESC
LIMIT 25;
SQLEOF

          cat > "$PY_FILE" <<PYEOF
"""$TITLE portfolio analysis.

Created: $DATE
This script uses synthetic sample data so the portfolio can run without private data.
Replace the sample generator with real extracts when available.
"""

from __future__ import annotations

import csv
import random
from pathlib import Path
from statistics import mean

random.seed($DAY)
OUTPUT_DIR = Path("charts")
OUTPUT_DIR.mkdir(exist_ok=True)

regions = ["East", "West", "Central", "South"]
rows = []
for store_id in range(101, 121):
    region = regions[store_id % len(regions)]
    prior_sales = random.randint(70000, 180000)
    current_sales = int(prior_sales * random.uniform(0.85, 1.18))
    visits = random.randint(1200, 4200)
    transactions = int(visits * random.uniform(0.18, 0.42))
    rating = round(random.uniform(3.6, 4.8), 2)
    rows.append({
        "store_id": store_id,
        "region": region,
        "prior_sales": prior_sales,
        "current_sales": current_sales,
        "visits": visits,
        "transactions": transactions,
        "rating": rating,
        "sales_growth_pct": round((current_sales - prior_sales) / prior_sales * 100, 2),
        "conversion_rate_pct": round(transactions / visits * 100, 2),
    })

portfolio_csv = OUTPUT_DIR / "${STAMP}_${SLUG}_sample_output.csv"
with portfolio_csv.open("w", newline="") as f:
    writer = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
    writer.writeheader()
    writer.writerows(rows)

region_summary = {}
for region in regions:
    region_rows = [r for r in rows if r["region"] == region]
    region_summary[region] = {
        "avg_sales_growth_pct": round(mean(r["sales_growth_pct"] for r in region_rows), 2),
        "avg_conversion_rate_pct": round(mean(r["conversion_rate_pct"] for r in region_rows), 2),
        "avg_rating": round(mean(r["rating"] for r in region_rows), 2),
    }

summary_md = OUTPUT_DIR / "${STAMP}_${SLUG}_summary.md"
with summary_md.open("w") as f:
    f.write("# $TITLE Sample Analysis Summary\\n\\n")
    f.write("## Regional Summary\\n\\n")
    for region, metrics in region_summary.items():
        f.write(f"- {region}: {metrics}\\n")
    f.write("\\n## Portfolio Note\\n")
    f.write("Synthetic data used for demonstration. Replace with real data for production analysis.\\n")

print(f"Created {portfolio_csv} and {summary_md}")
PYEOF

          cat > "$DASH_FILE" <<DASHEOF
# $TITLE Dashboard Specification - $DATE

## Audience
Operations, product analytics, field leadership, and customer experience stakeholders.

## Primary Views
1. Executive KPI summary
2. Store or segment ranking
3. Trend comparison by month
4. Opportunity flags and recommended actions

## Filters
- Region
- Store status
- Month
- Service category
- Rating band

## Core Metrics
- Total sales
- Total visits
- Conversion rate
- Average ticket
- Google rating
- Review volume
- Sales growth %
- Visit growth %

## Design Notes
Use conditional formatting for declining KPIs and include absolute counts next to percentages so stakeholders can understand both rate and volume impact.
DASHEOF

          cat >> docs/project-log.md <<LOGEOF

## $DATE - $TITLE

- Added case study: $CASE_FILE
- Added SQL analysis: $SQL_FILE
- Added Python synthetic analysis: $PY_FILE
- Added dashboard spec: $DASH_FILE
- Focus: $DESCRIPTION
LOGEOF

          # Lightweight issue backlog file for transparency without requiring GitHub issue API.
          cat >> issues/backlog.md <<ISSUEEOF

## $DATE - Follow-up for $TITLE

- Validate metric definitions against sample data model.
- Add one chart or dashboard screenshot.
- Add stakeholder recommendation section.
ISSUEEOF

      - name: Commit portfolio update
        shell: bash
        run: |
          DATE=$(date +"%Y-%m-%d")
          DAY=$(date +"%j")
          MESSAGES=(
            "Add retail analytics case study assets"
            "Expand SQL and Python analytics portfolio"
            "Update dashboard documentation and KPI logic"
            "Add store performance analysis materials"
            "Improve analytics case study documentation"
            "Add portfolio analysis script and SQL model"
          )
          MSG=${MESSAGES[$((10#$DAY % ${#MESSAGES[@]}))]}

          git config user.name "speddire"
          git config user.email "speddire@tepper.cmu.edu"
          git add .
          git commit -m "$MSG - $DATE" || echo "No changes to commit"
          git push
